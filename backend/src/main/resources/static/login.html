<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OOTD-LOGIC | 로그인</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <a class="brand" href="index.html"><img src="images/favicon.svg" alt="">OOTD-LOGIC</a>
      <h1>로그인</h1>
      <p>이메일로 로그인하고 내 옷장을 확인하세요.</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
        <div class="error-message"></div>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호" required minlength="8">
        <div class="error-message"></div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="rememberMe">
        <span>로그인 상태 유지</span>
      </div>

      <button type="submit" class="login-btn">로그인</button>
    </form>

    <div class="status-message" id="statusMessage"></div>

    <div class="login-footer">
      <p>계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
